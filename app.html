  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 't-pad-pro-v9';
        const URLS_TO_CACHE = [ './', './app.html' ];
        
        self.addEventListener('install', (e) => { 
          self.skipWaiting(); 
          e.waitUntil(caches.open(CACHE_NAME).then(c => Promise.all(URLS_TO_CACHE.map(u => fetch(u).then(r => c.put(u, r)).catch(e=>console.log(u)))))); 
        });
        
        self.addEventListener('activate', (e) => {
          e.waitUntil(caches.keys().then(keys => Promise.all(
            keys.map(k => { if(k !== CACHE_NAME) return caches.delete(k); })
          )));
        });

        self.addEventListener('fetch', (e) => { 
          if (e.request.mode === 'navigate') {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          } else {
            e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))); 
          }
        });
      `;
      const blob = new Blob([swCode], {type: 'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.log);
    }
  </script>

    // --- Constants for Pro Version (80 Pads) ---
    const TOTAL_PADS = 80;

    const getGroupColor = (index) => {
      const groupIdx = Math.floor(index / 20);
      switch(groupIdx) {
        case 0: return 'bg-red-600 hover:bg-red-500';      
        case 1: return 'bg-blue-600 hover:bg-blue-500';    
        case 2: return 'bg-emerald-600 hover:bg-emerald-500'; 
        case 3: return 'bg-amber-600 hover:bg-amber-500';  
        default: return 'bg-slate-600';
      }
    };

    const generatePads = (count) => Array.from({ length: count }, (_, i) => ({
      id: i, 
      keyTrigger: (i + 1).toString(),
      name: `Pad ${i + 1}`, 
      color: getGroupColor(i),
      buffer: null, blob: null, url: null, 
      settings: { 
        start: 0, end: 1, fadeIn: 0, fadeOut: 0, volume: 1, loop: false,
        enableTrigger: false, triggerTime: '' 
      }
    }));

    const formatDuration = (seconds) => {
      if (!seconds && seconds !== 0) return "--";
      return seconds.toFixed(2) + "s";
    };

    // --- Manual Modal ---
    const ManualModal = ({ onClose }) => {

                    画面の見方と基本操作

                    <p>T-PAD Proでは、画面に<b>20個のパッドが4グループ（計80パッド）</b>配置されています。</p>
                    <p>
                      <b>音声の読み込み:</b> 「読込」と書かれたパッドをタップしてファイルを選択します。<br/>
                      <b>再生と停止:</b> 読み込み済みのパッドをタップすると再生します。もう一度タップすると停止します。<br/>
                      <b>音量フェーダー:</b> 画面上部の「Faders」ボタンを押すと、各パッドに音量調整用のスライダーが表示されます。
                    </p>

                <section>

                      <b>2. チャンネルの割り当て:</b> 各Bank（A〜D）のヘッダーにあるプルダウンから、出力したいチャンネルペア（Ch 1-2, Ch 3-4 など）を選択してください。

      const [playingPads, setPlayingPads] = useState({}); 
      const [editingPadId, setEditingPadId] = useState(null);

      const projectInputRef = useRef(null);
      const triggerPadRef = useRef(null);
      const padsRef = useRef(pads); 
      
      const meterRefsL = useRef([]);
      const meterRefsR = useRef([]);

      const meterAnimationRef = useRef(null);

      useEffect(() => { padsRef.current = pads; }, [pads]);

      // Clock & Timer
      useEffect(() => {
        const interval = setInterval(() => {
          const now = new Date();
          const timeString = now.toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setCurrentTimeStr(timeString);
          if (isReady && audioCtxRef.current) {
            padsRef.current.forEach(pad => {
              if (pad.settings.enableTrigger && pad.settings.triggerTime) {
                let t = pad.settings.triggerTime; if (t.length === 5) t += ":00";
                if (t === timeString) triggerPadFromTimer(pad.id);
              }
            });
          }
        }, 1000);
        return () => clearInterval(interval);
      }, [isReady]);

      // Level Meter Animation Loop (安全装置付き)
      useEffect(() => {
        if (!isReady || analyzersRef.current.length === 0) return;
        const dataArray = new Float32Array(256);
        const byteArray = new Uint8Array(256); // フォールバック用
        
        const updateMeters = () => {
          try {
            for (let i = 0; i < 4; i++) {
              const analyzer = analyzersRef.current[i];
              if (!analyzer) continue;

              const getLevel = (node) => {
                let maxVal = 0;
                if (node.getFloatTimeDomainData) {
                  node.getFloatTimeDomainData(dataArray);
                  for(let j=0; j<dataArray.length; j++) if(Math.abs(dataArray[j]) > maxVal) maxVal = Math.abs(dataArray[j]);
                } else {
                  node.getByteTimeDomainData(byteArray);
                  for(let j=0; j<byteArray.length; j++) {
                    const f = (byteArray[j] - 128) / 128.0;
                    if(Math.abs(f) > maxVal) maxVal = Math.abs(f);
                  }
                }
                return maxVal;
              };

              let maxL = getLevel(analyzer.L);
              let maxR = getLevel(analyzer.R);

              const dbL = 20 * Math.log10(Math.max(maxL, 0.0001));
              const dbR = 20 * Math.log10(Math.max(maxR, 0.0001));

              let pctL = Math.max(0, Math.min(100, ((dbL + 60) / 60) * 100));
              let pctR = Math.max(0, Math.min(100, ((dbR + 60) / 60) * 100));

              let prevL = prevLevelsRef.current[i*2];
              let prevR = prevLevelsRef.current[i*2 + 1];

              pctL = pctL >= prevL ? pctL : prevL * 0.92 + pctL * 0.08;
              pctR = pctR >= prevR ? pctR : prevR * 0.92 + pctR * 0.08;

              prevLevelsRef.current[i*2] = pctL;
              prevLevelsRef.current[i*2 + 1] = pctR;

              if (meterRefsL.current[i]) {
                meterRefsL.current[i].style.height = `${pctL}%`;
                meterRefsL.current[i].style.backgroundColor = pctL > 95 ? '#ef4444' : pctL > 80 ? '#facc15' : '#22c55e';
              }
              if (meterRefsR.current[i]) {
                meterRefsR.current[i].style.height = `${pctR}%`;
                meterRefsR.current[i].style.backgroundColor = pctR > 95 ? '#ef4444' : pctR > 80 ? '#facc15' : '#22c55e';
              }
            }
            meterAnimationRef.current = requestAnimationFrame(updateMeters);
          } catch(e) {
             console.error("Meter animation error:", e);
          }
        };
        meterAnimationRef.current = requestAnimationFrame(updateMeters);
        return () => cancelAnimationFrame(meterAnimationRef.current);
      }, [isReady]);

      const updateRouting = useCallback((channelsArray, splitters, merger) => {
        if (!splitters || !merger || splitters.length === 0) return;
        channelsArray.forEach((chStart, groupIdx) => {
          const splitter = splitters[groupIdx];
          if (!splitter) return;
          try { splitter.disconnect(); } catch(e) {}
          try {
            splitter.connect(merger, 0, chStart);
            splitter.connect(merger, 1, chStart + 1);
          } catch(e) {
            try { splitter.connect(merger, 0, 0); splitter.connect(merger, 1, 1); } catch(fallbackErr) {}
          }
          const analyzer = analyzersRef.current[groupIdx];
          if (analyzer) {
            try {
              splitter.connect(analyzer.L, 0);
              splitter.connect(analyzer.R, 1);
            } catch(e) {}
          }
        });
      }, []);

      useEffect(() => {
        const loadPads = async () => {
          try {
            let hasData = false;
            const cCount = TOTAL_PADS;
            const loadedPads = generatePads(cCount);
            
            for (let i = 0; i < cCount; i++) {
              const data = await idbKeyval.get(`pad_${i}`);
              if (data) {
                const settings = { loop: false, enableTrigger: false, triggerTime: '', ...data.settings };
                let url = null;
                try { url = data.blob ? URL.createObjectURL(data.blob) : null; } catch(e){} 
                loadedPads[i] = { ...loadedPads[i], ...data, settings, buffer: null, url };
                hasData = true;
              }
            }
            if (hasData) setPads(loadedPads);
            
            const savedRouting = await idbKeyval.get('bankChannels');
            if (savedRouting) setBankChannels(savedRouting);

          } catch (e) { console.error(e); } finally { setIsLoadingData(false); }
        };
        loadPads();
      }, []);

      const savePadToDb = async (pad, index) => { try { const { buffer, url, ...d } = pad; await idbKeyval.set(`pad_${index}`, d); } catch (e) {} };

      const initAudio = async () => {
        if (audioCtxRef.current) {
          if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
          setIsReady(true);
          return;
        }
        
        setIsProcessing(true);
        setErrorMsg('');
        
        try {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => track.stop());
          } catch (err) {}

          try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const outDevices = devices.filter(d => d.kind === 'audiooutput');
            setOutputDevices(outDevices);
          } catch (err) { console.error("Failed to enumerate devices:", err); }

          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          audioCtxRef.current = ctx;

          const actualMax = ctx.destination.maxChannelCount || 2;
          const safeMax = Math.min(32, actualMax);
          ctx.destination.channelCount = safeMax;
          setMaxChannels(actualMax);

          const mergerChannels = Math.max(8, safeMax);
          let merger;
          try {
             merger = ctx.createChannelMerger(mergerChannels); 
          } catch(e) {
             merger = ctx.createChannelMerger(2); 
          }
          
          merger.connect(ctx.destination);
          mergerRef.current = merger;

          const splitters = [];
          const bankGains = [];
          const analysers = [];

          for (let i = 0; i < 4; i++) {
            const gain = ctx.createGain();
            gain.gain.value = 1.0;
            bankGains.push(gain);

            const splitter = ctx.createChannelSplitter(2);
            gain.connect(splitter);
            splitters.push(splitter);

            const analyserL = ctx.createAnalyser();
            const analyserR = ctx.createAnalyser();
            analyserL.fftSize = 256;
            analyserR.fftSize = 256;
            splitter.connect(analyserL, 0);
            splitter.connect(analyserR, 1);
            analysers.push({ L: analyserL, R: analyserR });
          }
          
          bankGainsRef.current = bankGains;
          splittersRef.current = splitters;
          analyzersRef.current = analysers;

          updateRouting(bankChannels, splitters, merger);

          const newPads = [...padsRef.current];
          await Promise.all(newPads.map(async (pad, idx) => {
            if (pad.blob && !pad.buffer) {
              try {
                const ab = await pad.blob.arrayBuffer();
                newPads[idx].buffer = await ctx.decodeAudioData(ab);
              } catch (e) { newPads[idx].name = "Load Failed"; }
            }
          }));
          
          setPads(newPads);
          setIsReady(true);
          ctx.resume();
        } catch (fatalError) {
          console.error("FATAL AUDIO INIT ERROR:", fatalError);
          setErrorMsg(fatalError.message || "予期せぬエラーが発生しました");
        } finally {
          setIsProcessing(false);
        }
      };

      const handleDeviceChange = async (deviceId) => {
        setSelectedDevice(deviceId);
        const ctx = audioCtxRef.current;
        if (ctx && typeof ctx.setSinkId === 'function') {
          try {
            await ctx.setSinkId(deviceId);
            const newMax = ctx.destination.maxChannelCount || 2;
            setMaxChannels(newMax);
            ctx.destination.channelCount = Math.min(32, newMax);
            updateRouting(bankChannels, splittersRef.current, mergerRef.current);
          } catch (e) {
            alert("出力デバイスの変更に失敗しました。ブラウザが対応していないか、権限がありません。");
          }
        } else {
            alert("お使いのブラウザは出力デバイスの切り替えに対応していません。(Chrome等をご利用ください)");
        }
      };

      const handleBankChannelChange = async (groupIdx, chStart) => {
        const newChannels = [...bankChannels];
        newChannels[groupIdx] = chStart;
        setBankChannels(newChannels);
        updateRouting(newChannels, splittersRef.current, mergerRef.current);
        try { await idbKeyval.set('bankChannels', newChannels); } catch(e){}
      };

      const stopPad = useCallback((padId) => {
        const nodes = activeAudioNodes.current[padId];
        const audioCtx = audioCtxRef.current;
        if (!nodes || !audioCtx) return;
        try {
          const { source, gain } = nodes;
          if (nodes.isStopping) return;
          nodes.isStopping = true;
          let fadeTime = 0.02; 
          gain.gain.cancelScheduledValues(audioCtx.currentTime);
          gain.gain.setValueAtTime(gain.gain.value, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + fadeTime);
          source.stop(audioCtx.currentTime + fadeTime);
        } catch (e) {}
      }, []);

      const triggerPad = useCallback((padId) => {
        if (isEditMode) return;
        const pad = padsRef.current[padId]; 
        const audioCtx = audioCtxRef.current;

        if (!pad || !pad.buffer || !audioCtx) return;
        const now = audioCtx.currentTime;
        
        if (activeAudioNodes.current[padId]) { 
          stopPad(padId); 
          return; 
        }
        
        const source = audioCtx.createBufferSource();
        source.buffer = pad.buffer;
        source.loop = pad.settings.loop;
        const gainNode = audioCtx.createGain();
        
        const groupIdx = Math.floor(padId / 20);
        
        source.connect(gainNode);
        gainNode.connect(bankGainsRef.current[groupIdx]); 
        
        const totalDuration = pad.buffer.duration;
        const startTime = pad.settings.start * totalDuration;
        const endTime = pad.settings.end * totalDuration;
        const playDuration = Math.max(0, endTime - startTime);
        const targetVolume = pad.settings.volume;
        
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(targetVolume, now + 0.02);
        
        if (!pad.settings.loop && pad.settings.fadeOut > 0) {
          const fadeOutStart = now + playDuration - pad.settings.fadeOut;
          if (fadeOutStart > now) {
             gainNode.gain.setValueAtTime(targetVolume, fadeOutStart);
             gainNode.gain.linearRampToValueAtTime(0, now + playDuration);
          }
        }

        if (pad.settings.loop) {
          source.loopStart = startTime; source.loopEnd = endTime; source.start(now, startTime); 
        } else {
          source.start(now, startTime, playDuration);
        }
        
        activeAudioNodes.current[padId] = { source, gain: gainNode, isStopping: false };
        setPlayingPads(prev => ({ ...prev, [padId]: { startTime: now, duration: playDuration, loop: pad.settings.loop } }));
        source.onended = () => {
          if (activeAudioNodes.current[padId]?.source === source) {
            delete activeAudioNodes.current[padId];
            setPlayingPads(prev => { const n = { ...prev }; delete n[padId]; return n; });
          }
        };
      }, [stopPad, isEditMode]); 

      const triggerPadFromTimer = (padId) => { if (activeAudioNodes.current[padId]) return; triggerPad(padId); };
      useEffect(() => { triggerPadRef.current = triggerPadFromTimer; }, [triggerPad]);

      const handleFileUpload = async (e, index) => {
        const file = e.target.files[0]; 
        const audioCtx = audioCtxRef.current;
        if (!file || !audioCtx) return;
        try {
          const ab = await file.arrayBuffer(); 
          const buff = await audioCtx.decodeAudioData(ab);
          setPads(prev => {
            const newPads = [...prev];
            const updated = { ...newPads[index], name: file.name.substring(0, 12), buffer: buff, blob: file, url: URL.createObjectURL(file) };
            newPads[index] = updated; savePadToDb(updated, index); return newPads;
          });
        } catch (e) { alert("読込失敗"); }
      };
      
      const updatePadSettings = (id, newSettings) => {
        setPads(prev => {
          const n = prev.map(p => p.id === id ? { ...p, settings: { ...p.settings, ...newSettings } } : p);
          const u = n.find(p => p.id === id); if(u) savePadToDb(u, id); return n;
        });
      };

      const handlePadVolumeChange = useCallback((padId, newVol) => {
        updatePadSettings(padId, { volume: newVol });
        const nodes = activeAudioNodes.current[padId];
        if (nodes && audioCtxRef.current) {
          nodes.gain.gain.setTargetAtTime(newVol, audioCtxRef.current.currentTime, 0.05);
        }
      }, []);

      const handleEditorClose = (padId) => setEditingPadId(null);
      
      const requestDelete = (padId) => setConfirmDeleteId(padId);
      const executeDelete = async () => {
        const pid = confirmDeleteId; if (pid === null) return; setConfirmDeleteId(null);
        if (activeAudioNodes.current[pid]) { try { activeAudioNodes.current[pid].source.stop(); } catch(e){} delete activeAudioNodes.current[pid]; setPlayingPads(p => { const n = { ...p }; delete n[pid]; return n; }); }
        setPads(prev => { const n = [...prev]; n[pid] = { id: pid, keyTrigger: (pid + 1).toString(), name: `Pad ${pid + 1}`, color: getGroupColor(pid), buffer: null, blob: null, url: null, settings: { start: 0, end: 1, fadeIn: 0, fadeOut: 0, volume: 1, loop: false, enableTrigger: false, triggerTime: '' } }; return n; });
        try { await idbKeyval.del(`pad_${pid}`); } catch (e) {}
      };
      
      const handlePadSwap = async (tid) => {
        if (swapSourceId === null) setSwapSourceId(tid);
        else if (swapSourceId === tid) setSwapSourceId(null);
        else {
          const n = [...pads]; const s = { ...n[swapSourceId] }; const t = { ...n[tid] };
          const gc = (p) => ({ name: p.name, color: p.color, buffer: p.buffer, blob: p.blob, url: p.url, settings: p.settings });
          n[swapSourceId] = { ...n[swapSourceId], ...gc(t), color: getGroupColor(swapSourceId) }; 
          n[tid] = { ...n[tid], ...gc(s), color: getGroupColor(tid) };
          setPads(n); setSwapSourceId(null); await savePadToDb(n[swapSourceId], swapSourceId); await savePadToDb(n[tid], tid);
        }
      };
      
      const handleExportProject = async () => { 
        if(!isReady) return; setIsProcessing(true); 
        try { 
          const z = new JSZip(); 
          const m = { padCount: TOTAL_PADS, bankChannels, timestamp: new Date().toISOString(), pads: [] }; 
          pads.forEach((p,i)=>{ 
            const pm={id:i, name:p.name, settings:p.settings, hasAudio:false}; 
            if(p.blob){ z.file(`a_${i}`, p.blob); pm.hasAudio=true; pm.fileName=`a_${i}`; } 
            m.pads.push(pm); 
          }); 
          z.file("project.json", JSON.stringify(m)); 
          const c = await z.generateAsync({type:"blob"}); 
          const u = URL.createObjectURL(c); 
          const a = document.createElement("a"); a.href=u; a.download=`TPAD_PRO_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.tsp`; 
          document.body.appendChild(a); a.click(); document.body.removeChild(a); 
        } catch(e){} finally { setIsProcessing(false); } 
      };
      
      const handleImportProject = async (e) => { 
        const f = e.target.files[0]; if(!f) return; setIsProcessing(true); 
        try { 
          const z = await JSZip.loadAsync(f); 
          const m = JSON.parse(await z.file("project.json").async("string")); 
          const c = TOTAL_PADS; 
          const np = generatePads(c); 
          
          if (m.bankChannels) {
             setBankChannels(m.bankChannels);
             updateRouting(m.bankChannels, splittersRef.current, mergerRef.current);
             try { await idbKeyval.set('bankChannels', m.bankChannels); } catch(err){}
          }

          const ctx = audioCtxRef.current;

          await Promise.all(m.pads.map(async (pm)=>{ 
            const idx = pm.id; 
            if(idx>=0 && idx<c){ 
              np[idx] = {...np[idx], name:pm.name, settings:{loop:false,enableTrigger:false,triggerTime:'', ...pm.settings}}; 
              if(pm.hasAudio && ctx){ 
                const b = await z.file(pm.fileName).async("blob"); 
                np[idx].blob=b; np[idx].url=URL.createObjectURL(b); 
                try{ np[idx].buffer = await ctx.decodeAudioData(await b.arrayBuffer()); }catch(x){} 
                await savePadToDb(np[idx], idx); 
              } else { 
                await idbKeyval.del(`pad_${idx}`); 
              } 
            } 
          })); 
          setPads(np); 
          if(!isReady && ctx) { setIsReady(true); if(ctx.state==='suspended') ctx.resume(); }
        } catch(e){
           console.error(e);
           alert("プロジェクトの読み込みに失敗しました。");
        } finally{
           setIsProcessing(false); e.target.value=null;
        } 
      };

      if (!isReady) {
        return (
          <div className="flex flex-col items-center justify-center h-screen bg-slate-900 text-white">
            <h1 className="text-4xl font-bold mb-2 tracking-tighter">T-PAD <span className="text-blue-500">Pro</span></h1>
            <p className="text-slate-400 mb-8 text-sm">80-Pad Professional Edition</p>
            <button onClick={initAudio} disabled={isLoadingData || isProcessing} className={`px-8 py-4 rounded-full font-bold text-xl shadow-[0_0_20px_rgba(37,99,235,0.5)] transition-all transform hover:scale-105 disabled:opacity-50 ${isProcessing ? 'bg-amber-600' : 'bg-blue-600 hover:bg-blue-500'}`}>
              {isLoadingData ? 'データ読込中...' : isProcessing ? '処理中...' : 'アプリを開始'}
            </button>
            
            {errorMsg && (
              <div className="mt-6 p-4 bg-red-900/50 border border-red-500 rounded-lg max-w-md text-center">
                <p className="text-red-400 font-bold mb-1">オーディオの起動に失敗しました</p>
                <p className="text-xs text-red-200">{errorMsg}</p>
                <p className="text-xs text-red-300 mt-2">※お使いのブラウザや機器が対応していない可能性があります。</p>
              </div>
            )}
            
            <p className="mt-4 text-xs text-slate-500">タップしてオーディオエンジンを起動</p>
            <p className="mt-2 text-[10px] text-amber-500 max-w-sm text-center">
               ※出力先デバイスを認識するため、初回起動時に「マイクの使用許可」を求められる場合があります。
            </p>
          </div>
        );
      }

      const channelOptions = [];
      for (let i = 0; i < 16; i++) {
        const startCh = i * 2;
        channelOptions.push(
           <option key={startCh} value={startCh} disabled={maxChannels < startCh + 2}>
             Ch {startCh + 1}-{startCh + 2}
           </option>
        );
      }

      return (
        <div className="flex flex-col h-screen bg-slate-900 text-slate-100 overflow-hidden select-none">
          <header className="flex flex-col gap-2 px-4 py-3 bg-slate-800 border-b border-slate-700 shadow-md z-10 flex-shrink-0">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2"><Music className="text-blue-400" /><h1 className="text-lg sm:text-xl font-bold tracking-tight">T-PAD <span className="text-blue-500 font-black text-sm">Pro</span></h1></div>
              
              <div className="flex items-center gap-2 ml-auto">
                 {!isEditMode && (
                   <div className="flex flex-col items-start bg-slate-900/50 px-3 py-1 rounded-lg border border-slate-700/50 mr-2 sm:mr-4 max-w-[150px] sm:max-w-[250px]">
                      <span className="text-[10px] text-slate-400 mb-0.5 flex items-center gap-1"><Headphones size={10}/> Master Output</span>
                      <select 
                        value={selectedDevice} 
                        onChange={(e) => handleDeviceChange(e.target.value)}
                        className="bg-slate-800 text-slate-200 text-xs rounded px-1 py-0.5 w-full truncate focus:outline-none focus:border-blue-500 cursor-pointer"
                      >
                        <option value="">Default (System OS)</option>
                        {outputDevices.map(d => (
                          <option key={d.deviceId} value={d.deviceId}>{d.label || 'Device...'}</option>
                        ))}
                      </select>
                      {maxChannels > 2 && <span className="text-[9px] text-emerald-400 mt-0.5">{maxChannels}ch Multichannel Ready</span>}
                   </div>
                 )}

                 {!isEditMode && (
                   <div className="flex flex-col items-center mr-2 bg-slate-900/50 px-3 py-1 rounded-lg border border-slate-700/50">
                      <span className="text-[10px] text-slate-400 mb-0.5">Clock (JST)</span>
                      <div className="bg-black/30 text-slate-300 text-xs px-2 py-0.5 rounded font-mono border border-slate-600">
                        {currentTimeStr || "--:--:--"}
                      </div>
                   </div>
                 )}
                 <button onClick={() => setShowPadFaders(!showPadFaders)} className={`flex items-center gap-1 px-3 py-1.5 rounded text-xs font-bold transition-colors mr-1 ${showPadFaders ? 'bg-blue-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}`} title="各パッドの音量フェーダーを表示"><Sliders size={14} /> Faders</button>
                 <button onClick={() => { setIsEditMode(!isEditMode); setSwapSourceId(null); }} className={`flex items-center gap-1 px-3 py-1.5 rounded text-xs font-bold transition-colors ${isEditMode ? 'bg-amber-600 text-white animate-pulse' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}`}><Edit3 size={14} /> {isEditMode ? 'EDIT中' : 'EDIT'}</button>
                 <button onClick={() => setShowManual(true)} className="flex items-center gap-1 px-3 py-1.5 rounded text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-300" title="マニュアル"><BookOpen size={16} /></button>
                 <div className="flex items-center gap-1 bg-slate-700/50 rounded p-0.5">
                   <button onClick={handleExportProject} disabled={isProcessing || isEditMode} className="p-1.5 hover:bg-slate-600 rounded text-slate-300 disabled:opacity-30"><Download size={16} /></button>
                   <button onClick={() => projectInputRef.current.click()} disabled={isProcessing || isEditMode} className="p-1.5 hover:bg-slate-600 rounded text-slate-300 disabled:opacity-30"><FolderOpen size={16} /></button>
                   <input type="file" ref={projectInputRef} className="hidden" onChange={handleImportProject} />
                 </div>
              </div>
            </div>
            {isEditMode && <div className="bg-amber-900/30 text-amber-200 text-xs text-center py-1 px-2 rounded border border-amber-800/50 flex items-center justify-center gap-2 mt-2"><span>パッドをタップして移動(入替)</span><span className="w-px h-3 bg-amber-700"></span><span>右上の<Trash2 size={10} className="inline"/>で削除</span></div>}
          </header>

          <div className="flex flex-1 overflow-hidden">
             <main className="flex-1 p-2 sm:p-4 overflow-y-auto bg-slate-950">
               {isProcessing && <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"><div className="text-xl font-bold animate-pulse">処理中...</div></div>}
               
               <div className="flex gap-4 h-full w-full min-w-max mx-auto p-2">
                  {[0, 1, 2, 3].map(groupIndex => (
                    <div key={groupIndex} className="flex-1 flex flex-col min-w-[280px] bg-slate-800/40 rounded-2xl p-3 border border-slate-800 shadow-lg">
                      
                      <div className="flex justify-between items-center text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">
                        <span>Bank {['A', 'B', 'C', 'D'][groupIndex]}</span>
                        <select 
                          value={bankChannels[groupIndex]} 
                          onChange={(e) => handleBankChannelChange(groupIndex, parseInt(e.target.value))}
                          className="bg-slate-900 border border-slate-700 text-emerald-400 text-[10px] font-bold rounded px-1.5 py-0.5 focus:outline-none focus:border-blue-500 cursor-pointer"
                          title="出力チャンネルの選択 (パラアウト)"
                        >
                           {channelOptions}
                        </select>
                      </div>

                      <div className="flex flex-1 gap-2 overflow-hidden">
                        {/* Pad Grid */}
                        <div className="grid grid-cols-4 grid-rows-5 gap-2 flex-1">
                          {pads.slice(groupIndex * 20, (groupIndex + 1) * 20).map((pad, idx) => {
                            const realIdx = groupIndex * 20 + idx;
                            return (
                              <div key={pad.id} className="relative w-full h-full min-h-[60px]">
                                <PadBase 
                                  pad={pad} 
                                  playingInfo={playingPads[pad.id]} 
                                  audioCtx={audioCtxRef.current} 
                                  isEditMode={isEditMode} 
                                  isSwapSelected={swapSourceId === pad.id} 
                                  showFader={showPadFaders}
                                  onVolumeChange={(vol) => handlePadVolumeChange(pad.id, vol)}
                                  onInteraction={() => { 
                                    if (isEditMode) { handlePadSwap(pad.id); } 
                                    else if (!pad.buffer && !pad.blob) { fileInputRefs.current[realIdx].click(); } 
                                    else { triggerPad(pad.id); } 
                                  }} 
                                />
                                <div className="absolute top-0 right-0 z-50 p-1 flex gap-1 pointer-events-auto">
                                  {isEditMode && (pad.buffer || pad.blob) && <button onPointerDown={(e)=>e.stopPropagation()} onMouseDown={(e)=>e.stopPropagation()} onClick={(e) => { e.stopPropagation(); requestDelete(pad.id); }} className="p-2 bg-red-600 hover:bg-red-500 text-white rounded-full shadow-lg touch-manipulation cursor-pointer"><Trash2 size={14} /></button>}
                                  {!isEditMode && (pad.buffer || pad.blob) && <button onPointerDown={(e)=>e.stopPropagation()} onMouseDown={(e)=>e.stopPropagation()} onClick={(e) => { e.stopPropagation(); setEditingPadId(pad.id); }} className="p-1.5 bg-black/40 hover:bg-black/60 text-white rounded-full shadow-sm touch-manipulation cursor-pointer"><Settings size={12} /></button>}
                                </div>
                                {isEditMode && <div className="absolute top-1 left-1 z-40 opacity-50 pointer-events-none text-white"><Move size={12} /></div>}
                              </div>
                            );
                          })}
                        </div>
                        
                        {/* Level Meter for this Bank */}
                        <div className="w-4 sm:w-5 bg-slate-900 border border-slate-700/50 rounded-lg flex flex-col overflow-hidden p-0.5 shadow-inner flex-shrink-0">
                          <div className="flex-1 flex gap-0.5 w-full relative">
                            {/* Scale Markers */}
                            <div className="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-30 z-10 py-1">
                               <div className="w-full h-px bg-red-400"></div>
                               <div className="w-full h-px bg-yellow-400 mt-auto mb-[20%]"></div>
                               <div className="w-full h-px bg-white mb-[40%]"></div>
                            </div>
                            
                            {/* L/R Bars */}
                            <div className="flex-1 bg-slate-800/80 rounded-sm relative flex flex-col justify-end overflow-hidden">
                              <div ref={el => meterRefsL.current[groupIndex] = el} className="w-full bg-green-500 transition-colors duration-75" style={{ height: '0%' }}></div>
                            </div>
                            <div className="flex-1 bg-slate-800/80 rounded-sm relative flex flex-col justify-end overflow-hidden">
                              <div ref={el => meterRefsR.current[groupIndex] = el} className="w-full bg-green-500 transition-colors duration-75" style={{ height: '0%' }}></div>
                            </div>
                          </div>
                          <div className="h-3 flex items-center justify-center gap-0.5 mt-0.5 text-[6px] text-slate-500 font-bold uppercase tracking-tighter">
                            <span>L</span><span>R</span>
                          </div>
                        </div>

                      </div>
                    </div>
                  ))}
               </div>
             </main>
          </div>

          {/* Hidden File Inputs */}
          {pads.map((pad, idx) => (
            <input key={pad.id} type="file" className="hidden" ref={el => fileInputRefs.current[idx] = el} onChange={(e) => handleFileUpload(e, idx)} />
          ))}

          {/* Editor Modal */}
          {editingPadId !== null && (
            <EditorModal 
              pad={pads.find(p => p.id === editingPadId)} 
              onClose={() => handleEditorClose(editingPadId)} 
              onUpdate={(settings) => updatePadSettings(editingPadId, settings)} 
              audioCtx={audioCtxRef.current} 
              masterGainNode={bankGainsRef.current ? bankGainsRef.current[Math.floor(editingPadId / 20)] : null}
            />
          )}

          {/* Manual & Modals */}
          {showManual && <ManualModal onClose={() => setShowManual(false)} />}
          {confirmDeleteId !== null && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm">
              <div className="bg-slate-800 rounded-xl p-6 max-w-sm w-full border border-slate-700 shadow-2xl">
                <div className="flex items-center gap-3 text-amber-500 mb-4"><AlertTriangle size={32} /><h3 className="text-lg font-bold text-white">確認</h3></div>
                <p className="text-slate-300 mb-6">このパッドの音声ファイルを完全に削除しますか？</p>
                <div className="flex gap-3 justify-end">
                  <button onClick={() => setConfirmDeleteId(null)} className="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600 text-white font-medium transition-colors">キャンセル</button>
                  <button onClick={executeDelete} className="px-4 py-2 rounded bg-red-600 hover:bg-red-500 text-white font-bold shadow-lg transition-colors">削除する</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const PadBase = ({ pad, playingInfo, audioCtx, isEditMode, isSwapSelected, onInteraction, showFader, onVolumeChange }) => {
      const hasAudio = !!pad.buffer || !!pad.blob;
      const progressRef = useRef(null);
      const padRef = useRef(null);
      const animationRef = useRef(null);
      const timeDisplayRef = useRef(null);
      
      const handlePointer = (e) => { 
        if (isEditMode) { 
          if (e.type === 'click') onInteraction(); 
        } else { 
          if (!hasAudio && e.type === 'click') onInteraction(); 
          if (hasAudio && e.type === 'pointerdown') onInteraction(); 
        } 
      };

      let totalDuration = 0; if (hasAudio && pad.buffer) totalDuration = pad.buffer.duration * (pad.settings.end - pad.settings.start);

      useEffect(() => {
        if (!playingInfo || !audioCtx) {
          if (progressRef.current) progressRef.current.style.width = '0%';
          if (padRef.current) padRef.current.classList.remove('animate-flash');
          if (timeDisplayRef.current && totalDuration > 0) timeDisplayRef.current.innerText = formatDuration(totalDuration);
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
          return;
        }
        const update = () => {
          const now = audioCtx.currentTime;
          const elapsed = now - playingInfo.startTime;
          const duration = playingInfo.duration;
          let displayTime = 0, percent = 0;
          if (playingInfo.loop) {
            const loopPos = elapsed % duration; percent = (loopPos / duration) * 100; displayTime = duration - loopPos;
            if (padRef.current) padRef.current.classList.remove('animate-flash');
          } else {
            const remaining = Math.max(0, duration - elapsed); percent = Math.min(100, Math.max(0, (elapsed / duration) * 100)); displayTime = remaining;
            if (remaining <= 5 && remaining > 0) { if (padRef.current) padRef.current.classList.add('animate-flash'); } else { if (padRef.current) padRef.current.classList.remove('animate-flash'); }
            if (percent >= 100 && padRef.current) padRef.current.classList.remove('animate-flash');
          }
          if (progressRef.current) progressRef.current.style.width = `${percent}%`;
          if (timeDisplayRef.current) timeDisplayRef.current.innerText = formatDuration(displayTime);
          if (playingInfo.loop || (elapsed < duration)) animationRef.current = requestAnimationFrame(update);
        };
        animationRef.current = requestAnimationFrame(update);
        return () => cancelAnimationFrame(animationRef.current);
      }, [playingInfo, audioCtx, totalDuration]);

      return (
        <div ref={padRef} className={`w-full h-full rounded-xl border-b-[3px] transition-all active:border-b-0 active:translate-y-[2px] cursor-pointer relative overflow-hidden ${hasAudio ? pad.color : 'bg-slate-700/80 border-slate-600'} ${hasAudio ? 'border-black/30 shadow-md' : ''} ${playingInfo ? 'brightness-125 scale-[0.97] border-b-0 translate-y-[2px] ring-2 ring-white/50' : ''} ${isEditMode ? 'ring-2 ring-amber-500/50 border-amber-600 border-dashed' : ''} ${isSwapSelected ? 'ring-4 ring-amber-400 animate-pulse scale-95 opacity-80' : ''}`} onPointerDown={handlePointer} onClick={handlePointer}>
          {playingInfo && <div className="absolute bottom-0 left-0 h-full bg-white/20 pointer-events-none transition-all duration-75 ease-linear" ref={progressRef} style={{width: '0%'}}></div>}
          <div className="absolute top-1 left-1 flex gap-1 pointer-events-none text-white/50">{pad.settings.loop && hasAudio && !isEditMode && <Repeat size={10} />}{pad.settings.enableTrigger && hasAudio && !isEditMode && <Timer size={10} className="text-yellow-400" />}</div>
          
          <div className={`flex flex-col items-center justify-center h-full p-1 pointer-events-none select-none relative z-10 ${showFader && hasAudio && !isEditMode ? 'pb-6' : ''}`}>
            <span className="absolute top-0.5 left-1.5 font-mono text-xs sm:text-sm font-black opacity-40 text-black/60">{isEditMode ? '' : pad.keyTrigger}</span>
            {!hasAudio ? (
              <div className="flex flex-col items-center text-slate-400/50">
                <Upload size={20} className={`mb-1 ${isEditMode ? 'hidden' : ''}`} />
                <span className="text-[10px] font-medium">{isEditMode ? '空' : '読込'}</span>
              </div>
            ) : (
              <div className="text-center w-full">
                <div className="font-bold text-[10px] xl:text-[11px] text-white drop-shadow-md break-words line-clamp-2 leading-tight px-0.5 mb-1">{pad.name}</div>
                {!isEditMode && (
                  <div className="flex items-center justify-center gap-0.5 text-[9px] font-mono font-bold bg-black/40 rounded-full px-1.5 py-0.5 mx-auto w-fit text-white border border-white/10 shadow-sm">
                    <Clock size={8} /> <span ref={timeDisplayRef}>{formatDuration(totalDuration)}</span>
                  </div>
                )}
                {playingInfo && (
                  <div className="absolute bottom-0.5 left-0 right-0 flex justify-center">
                    <div className="animate-pulse text-[7px] font-bold uppercase tracking-wider text-white/80">PLAY</div>
                  </div>
                )}
                {!isEditMode && pad.settings.enableTrigger && !playingInfo && (
                  <div className="absolute bottom-0.5 left-0 right-0 flex justify-center text-[7px] text-yellow-300 font-mono bg-black/50 w-fit mx-auto px-1 rounded">@{pad.settings.triggerTime}</div>
                )}
              </div>
            )}
          </div>

          {/* Individual Pad Fader */}
          {showFader && hasAudio && !isEditMode && (
            <div 
              className="absolute bottom-0 left-0 right-0 h-6 bg-slate-900/90 border-t border-black/30 flex items-center px-2 z-50 pointer-events-auto"
              onPointerDown={(e) => e.stopPropagation()}
              onClick={(e) => e.stopPropagation()}
            >
              <input 
                type="range" min="0" max="4.0" step="0.01" 
                value={pad.settings.volume} 
                onChange={(e) => onVolumeChange(parseFloat(e.target.value))} 
                className="w-full h-1 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-white" 
              />
            </div>
          )}
        </div>
      );
    };

    const EditorModal = ({ pad, onClose, onUpdate, audioCtx, masterGainNode }) => {
      const canvasRef = useRef(null);
      const [zoomX, setZoomX] = useState(1);
      const [zoomY, setZoomY] = useState(1);
      const [scrollPos, setScrollPos] = useState(0); 
      const [draggingHandle, setDraggingHandle] = useState(null);
      const [hoverHandle, setHoverHandle] = useState(null);
      const [isPreviewPlaying, setIsPreviewPlaying] = useState(false);
      const previewSourceRef = useRef(null);
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [seekPos, setSeekPos] = useState(null); 
      const previewTimeRef = useRef(null);
      const previewStartTimeRef = useRef(0);
      const animationRef = useRef(null);

      const totalDuration = pad.buffer ? pad.buffer.duration : 0;

      const handleTimeChange = (type, secondsStr) => {
         const seconds = parseFloat(secondsStr); if (isNaN(seconds)) return;
         let ratio = seconds / totalDuration; if (ratio < 0) ratio = 0; if (ratio > 1) ratio = 1;
         if (type === 'start') { if (ratio < pad.settings.end) onUpdate({ start: ratio }); } else { if (ratio > pad.settings.start) onUpdate({ end: ratio }); }
      };

      const getCurrentRatio = () => {
         if (isPreviewPlaying && pad.buffer && audioCtx) {
             const now = audioCtx.currentTime;
             const duration = pad.buffer.duration;
             const playStart = pad.settings.start * duration;
             const playLength = (pad.settings.end * duration) - playStart;
             const elapsed = now - previewStartTimeRef.current;
             if (pad.settings.loop) { return (playStart + (elapsed % playLength)) / duration; } else { return elapsed / duration; }
         } else if (seekPos !== null) return seekPos; else return pad.settings.start;
      };

      const togglePreview = () => {
        if (isPreviewPlaying) { if (previewSourceRef.current) { try { previewSourceRef.current.stop(); } catch(e) {} previewSourceRef.current = null; } setIsPreviewPlaying(false); if(animationRef.current) cancelAnimationFrame(animationRef.current); } else { startPreview(null); }
      };

      const startPreview = (startRatio = null) => {
          if (!pad.buffer || !audioCtx) return;
          if (previewSourceRef.current) { try { previewSourceRef.current.stop(); } catch(e){} previewSourceRef.current = null; }

          const source = audioCtx.createBufferSource();
          source.buffer = pad.buffer;
          const gainNode = audioCtx.createGain();
          source.connect(gainNode);
          if (masterGainNode) gainNode.connect(masterGainNode);
          else gainNode.connect(audioCtx.destination);
          
          const now = audioCtx.currentTime;
          let playStartRatio = startRatio !== null ? startRatio : (seekPos !== null ? seekPos : pad.settings.start);
          if (playStartRatio < 0) playStartRatio = 0; if (playStartRatio > 1) playStartRatio = 0;
          const startTimeOffset = playStartRatio * totalDuration;
          const settingsStart = pad.settings.start * totalDuration;
          const settingsEnd = pad.settings.end * totalDuration;

          gainNode.gain.value = pad.settings.volume;
          
          if (Math.abs(playStartRatio - pad.settings.start) < 0.01 && pad.settings.fadeIn > 0) {
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(pad.settings.volume, now + Math.min(pad.settings.fadeIn, (settingsEnd - startTimeOffset)));
          }
          if (!pad.settings.loop && pad.settings.fadeOut > 0) {
             const playDuration = Math.max(0, settingsEnd - startTimeOffset);
             const fadeOutStart = now + playDuration - pad.settings.fadeOut;
             if (fadeOutStart > now) {
                 gainNode.gain.setValueAtTime(pad.settings.volume, fadeOutStart);
                 gainNode.gain.linearRampToValueAtTime(0, now + playDuration);
             }
          }
          source.loop = pad.settings.loop;
          if (pad.settings.loop) { source.loopStart = settingsStart; source.loopEnd = settingsEnd; source.start(now, startTimeOffset); }
          else { source.start(now, startTimeOffset); const durationToPlay = Math.max(0, settingsEnd - startTimeOffset); source.stop(now + durationToPlay); }

          previewSourceRef.current = source;
          previewStartTimeRef.current = now - startTimeOffset;
          setIsPreviewPlaying(true);
          source.onended = () => { };
      };

      useEffect(() => { return () => { if (previewSourceRef.current) { try { previewSourceRef.current.stop(); } catch(e) {} } if(animationRef.current) cancelAnimationFrame(animationRef.current); }; }, []);

      const getScreenX = useCallback((n, w, t) => { const v = Math.floor(t / zoomX); const m = t - v; const s = Math.floor(scrollPos * m); return ((n * t - s) / v) * w; }, [zoomX, scrollPos]);
      const getNormalizedFromScreenX = useCallback((x, w, t) => { const v = Math.floor(t / zoomX); const m = t - v; const s = Math.floor(scrollPos * m); const r = (x / w) * v; return Math.max(0, Math.min(1, (s + r) / t)); }, [zoomX, scrollPos]);

      const handlePointerDown = (e) => {
        if (!canvasRef.current || !pad.buffer) return;
        const rect = canvasRef.current.getBoundingClientRect(); const x = e.clientX - rect.left; const width = rect.width; const totalSamples = pad.buffer.length;
        const startX = getScreenX(pad.settings.start, width, totalSamples);
        const endX = getScreenX(pad.settings.end, width, totalSamples);
        const threshold = 50; 
        if (Math.abs(x - startX) < threshold) { setDraggingHandle('start'); e.target.setPointerCapture(e.pointerId); }
        else if (Math.abs(x - endX) < threshold) { setDraggingHandle('end'); e.target.setPointerCapture(e.pointerId); }
        else {
           const clickRatio = getNormalizedFromScreenX(x, width, totalSamples); setSeekPos(clickRatio);
           if (isPreviewPlaying) startPreview(clickRatio);
           setDraggingHandle('seek'); e.target.setPointerCapture(e.pointerId);
        }
      };

      const handlePointerMove = (e) => {
        if (!canvasRef.current || !pad.buffer) return;
        const rect = canvasRef.current.getBoundingClientRect(); const x = e.clientX - rect.left; const width = rect.width; const totalSamples = pad.buffer.length;
        if (draggingHandle) {
          const newVal = getNormalizedFromScreenX(x, width, totalSamples);
          if (draggingHandle === 'start') { if (newVal < pad.settings.end) onUpdate({ start: newVal }); }
          else if (draggingHandle === 'end') { if (newVal > pad.settings.start) onUpdate({ end: newVal }); }
          else if (draggingHandle === 'seek') { setSeekPos(newVal); }
          return;
        }
        const startX = getScreenX(pad.settings.start, width, totalSamples); const endX = getScreenX(pad.settings.end, width, totalSamples); const threshold = 50; 
        if (Math.abs(x - startX) < threshold) setHoverHandle('start'); else if (Math.abs(x - endX) < threshold) setHoverHandle('end'); else setHoverHandle(null);
      };

      const handlePointerUp = (e) => { if (draggingHandle === 'seek') { if (isPreviewPlaying) startPreview(seekPos); } setDraggingHandle(null); if(e.target) e.target.releasePointerCapture(e.pointerId); };

      useEffect(() => {
        const render = () => {
            if (!pad.buffer || !canvasRef.current) return;
            const canvas = canvasRef.current; const ctx = canvas.getContext('2d');
            const width = canvas.width; const height = canvas.height; const totalSamples = pad.buffer.length;
            ctx.clearRect(0, 0, width, height); ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, width, height);
            const data = pad.buffer.getChannelData(0);
            const viewSizeSamples = Math.floor(totalSamples / zoomX);
            const maxScrollSamples = totalSamples - viewSizeSamples;
            const startSample = Math.floor(scrollPos * maxScrollSamples);
            const step = Math.ceil(viewSizeSamples / width); const amp = (height / 2);
            const volume = pad.settings.volume; 
            
            const skipStep = Math.max(1, Math.ceil(step / 50)); 

            ctx.fillStyle = '#60a5fa'; ctx.beginPath();
            for (let i = 0; i < width; i++) {
                let min = 1.0, max = -1.0;
                const sampleIndexStart = startSample + (i * step);
                for (let j = 0; j < step; j += skipStep) {
                    const idx = sampleIndexStart + j;
                    if (idx < startSample + viewSizeSamples && idx < totalSamples) {
                        let datum = data[idx] * zoomY * volume;
                        if (datum < -1) datum = -1; if (datum > 1) datum = 1;
                        if (datum < min) min = datum; if (datum > max) max = datum;
                    }
                }
                if (min > max) { min = 0; max = 0; }
                const y1 = (1 + min) * amp; const y2 = (1 + max) * amp;
                ctx.fillRect(i, y1, 1, Math.max(1, y2 - y1));
            }
            const startX = getScreenX(pad.settings.start, width, totalSamples);
            const endX = getScreenX(pad.settings.end, width, totalSamples);
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            if (startX > 0) ctx.fillRect(0, 0, Math.min(width, startX), height);
            if (endX < width) ctx.fillRect(Math.max(0, endX), 0, width - Math.max(0, endX), height);
            const drawLine = (x, color, isHovered) => {
                if (x < -5 || x > width + 5) return;
                ctx.strokeStyle = color; ctx.lineWidth = isHovered ? 4 : 2;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, 10, isHovered ? 6 : 4, 0, Math.PI * 2); ctx.fill();
            };
            drawLine(startX, '#22c55e', draggingHandle === 'start' || hoverHandle === 'start');
            drawLine(endX, '#ef4444', draggingHandle === 'end' || hoverHandle === 'end');
            if (seekPos !== null) {
               const seekX = getScreenX(seekPos, width, totalSamples);
               if (seekX >= 0 && seekX <= width) { ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(seekX, 0); ctx.lineTo(seekX, height); ctx.stroke(); }
            }
            let currentTimeDisplay = pad.settings.start * totalDuration;
            if (seekPos !== null && !isPreviewPlaying) currentTimeDisplay = seekPos * totalDuration;
            if (isPreviewPlaying && pad.buffer) {
                const now = audioCtx.currentTime; const duration = pad.buffer.duration;
                const playStart = pad.settings.start * duration; const playLength = (pad.settings.end * duration) - playStart;
                const elapsed = now - previewStartTimeRef.current;
                let currentPosRatio = 0;
                if (pad.settings.loop) { const loopOffset = elapsed % playLength; currentPosRatio = (playStart + loopOffset) / duration; } else { currentPosRatio = (elapsed / duration); }
                currentTimeDisplay = currentPosRatio * duration;
                if (currentPosRatio <= 1.0) {
                    const playheadX = getScreenX(currentPosRatio, width, totalSamples);
                    if (playheadX >= 0 && playheadX <= width) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(playheadX, 0); ctx.lineTo(playheadX, height); ctx.stroke(); }
                }
                animationRef.current = requestAnimationFrame(render);
            }
            if (previewTimeRef.current) previewTimeRef.current.innerText = formatDuration(currentTimeDisplay);
        };
        render();
        return () => { if (animationRef.current) cancelAnimationFrame(animationRef.current); };
      }, [pad, zoomX, zoomY, scrollPos, draggingHandle, hoverHandle, isPreviewPlaying, getScreenX, audioCtx, seekPos]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
          <div className="bg-slate-800 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl border border-slate-700 flex flex-col max-h-[90vh]">
            <div className="flex items-center justify-between p-4 border-b border-slate-700 bg-slate-900/50 flex-shrink-0">
              <h2 className="text-lg font-bold flex items-center gap-2"><Scissors size={18} /> 波形編集: {pad.name}</h2>
              <button onClick={onClose} className="p-2 hover:bg-slate-700 rounded-full"><X size={20} /></button>
            </div>
            <div className="p-6 space-y-6 overflow-y-auto flex-1">
              <div className="flex justify-center pb-2 items-center gap-4">
                  <button onClick={togglePreview} className={`flex items-center gap-2 px-6 py-3 rounded-full font-bold text-lg shadow-lg transition-all active:scale-95 touch-manipulation ${isPreviewPlaying ? 'bg-amber-500 text-white animate-pulse' : 'bg-green-600 text-white hover:bg-green-500'}`}>
                     {isPreviewPlaying ? <Square fill="currentColor" size={20}/> : <Play fill="currentColor" size={20}/>} {isPreviewPlaying ? "停止" : "プレビュー再生"}
                  </button>
                  <div className="bg-black/30 text-white font-mono text-xl px-4 py-2 rounded border border-white/10 shadow-inner w-32 text-center" ref={previewTimeRef}>0.00s</div>
              </div>
              <div className="space-y-2">
                <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-700/30 p-2 rounded-lg">
                  <div className="flex items-center gap-2"><span className="text-xs font-bold text-slate-400 uppercase flex items-center gap-1"><ArrowLeftRight size={12} /> 時間 (横)</span><button onClick={() => setZoomX(prev => Math.max(1, prev - 1))} className="p-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-300 disabled:opacity-50 touch-manipulation" disabled={zoomX <= 1}><ZoomOut size={16} /></button><span className="text-xs font-mono w-8 text-center">{zoomX}x</span><button onClick={() => setZoomX(prev => Math.min(50, prev + 1))} className="p-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-300 touch-manipulation"><ZoomIn size={16} /></button></div>
                  <div className="flex items-center gap-2"><span className="text-xs font-bold text-slate-400 uppercase flex items-center gap-1"><ArrowUpDown size={12} /> 振幅 (縦)</span><button onClick={() => setZoomY(prev => Math.max(1, prev - 0.5))} className="p-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-300 disabled:opacity-50 touch-manipulation" disabled={zoomY <= 1}><ZoomOut size={16} /></button><span className="text-xs font-mono w-10 text-center">{zoomY.toFixed(1)}x</span><button onClick={() => setZoomY(prev => Math.min(10, prev + 0.5))} className="p-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-300 touch-manipulation"><ZoomIn size={16} /></button></div>
                  <button onClick={() => { setZoomX(1); setZoomY(1); setScrollPos(0); }} className="ml-auto text-xs flex items-center gap-1 px-3 py-1.5 bg-slate-600 hover:bg-slate-500 rounded text-white touch-manipulation"><Maximize size={12} /> 表示リセット</button>
                </div>
                <div className="relative h-48 w-full rounded-lg overflow-hidden ring-1 ring-slate-600 bg-slate-900 shadow-inner group">
                  <canvas ref={canvasRef} width={800} height={192} style={{ touchAction: 'none' }} className={`w-full h-full object-cover ${hoverHandle ? 'cursor-ew-resize' : 'cursor-default'}`} onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerLeave={handlePointerUp} />
                  {zoomX === 1 && !draggingHandle && !hoverHandle && (<div className="absolute bottom-2 right-2 text-[10px] text-slate-500 pointer-events-none opacity-50">緑(開始)・赤(終了)の線をドラッグして調整</div>)}
                </div>
                <div className={`transition-opacity duration-200 ${zoomX > 1 ? 'opacity-100' : 'opacity-30 pointer-events-none'}`}><input type="range" min="0" max="1" step="0.001" value={scrollPos} onChange={(e) => setScrollPos(parseFloat(e.target.value))} className="w-full accent-slate-400 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer touch-none p-2" /></div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-700/50">
                <div className="space-y-4 p-4 bg-slate-700/30 rounded-lg">
                  <h3 className="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">範囲指定 (秒)</h3>
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs items-center">
                       <span className="text-green-400 font-bold">開始位置</span>
                       <div className="flex gap-2 items-center">
                          <button onClick={() => { const currentRatio = getCurrentRatio(); if (currentRatio < pad.settings.end) onUpdate({ start: currentRatio }); }} className="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-200 border border-slate-500 flex items-center gap-1" title="現在位置を設定"><ArrowDown size={10} /> 現在位置</button>
                          <input type="number" step="0.001" className="bg-slate-800 border border-slate-600 rounded px-1 text-right text-xs w-20 text-white focus:outline-none focus:border-green-500" value={(pad.settings.start * totalDuration).toFixed(3)} onChange={(e) => handleTimeChange('start', e.target.value)} />
                       </div>
                    </div>
                    <input type="range" min="0" max="1" step="0.001" value={pad.settings.start} onChange={(e) => { const val = parseFloat(e.target.value); if (val < pad.settings.end) onUpdate({ start: val }); }} className="w-full accent-green-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer touch-none p-2" />
                  </div>
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs items-center">
                       <span className="text-red-400 font-bold">終了位置</span>
                       <div className="flex gap-2 items-center">
                          <button onClick={() => { const currentRatio = getCurrentRatio(); if (currentRatio > pad.settings.start) onUpdate({ end: currentRatio }); }} className="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-200 border border-slate-500 flex items-center gap-1" title="現在位置を設定"><ArrowDown size={10} /> 現在位置</button>
                          <input type="number" step="0.001" className="bg-slate-800 border border-slate-600 rounded px-1 text-right text-xs w-20 text-white focus:outline-none focus:border-red-500" value={(pad.settings.end * totalDuration).toFixed(3)} onChange={(e) => handleTimeChange('end', e.target.value)} />
                       </div>
                    </div>
                    <input type="range" min="0" max="1" step="0.001" value={pad.settings.end} onChange={(e) => { const val = parseFloat(e.target.value); if (val > pad.settings.start) onUpdate({ end: val }); }} className="w-full accent-red-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer touch-none p-2" />
                  </div>
                </div>
                <div className="space-y-4 p-4 bg-slate-700/30 rounded-lg">
                  <h3 className="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">エフェクト</h3>
                  <div className="flex items-center justify-between bg-slate-900/50 p-2 rounded mb-2">
                    <span className="text-xs font-bold text-slate-300 flex items-center gap-1"><Repeat size={14} /> リピート再生</span>
                    <button onClick={() => onUpdate({ loop: !pad.settings.loop })} className={`relative inline-flex h-5 w-9 items-center rounded-full transition-colors touch-manipulation ${pad.settings.loop ? 'bg-blue-600' : 'bg-slate-600'}`}><span className={`inline-block h-3 w-3 transform rounded-full bg-white transition-transform ${pad.settings.loop ? 'translate-x-5' : 'translate-x-1'}`} /></button>
                  </div>
                  <div className="bg-slate-900/50 p-2 rounded mb-2 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-slate-300 flex items-center gap-1"><Timer size={14} className="text-yellow-400" /> タイマー再生</span>
                      <button onClick={() => onUpdate({ enableTrigger: !pad.settings.enableTrigger })} className={`relative inline-flex h-5 w-9 items-center rounded-full transition-colors touch-manipulation ${pad.settings.enableTrigger ? 'bg-yellow-600' : 'bg-slate-600'}`}><span className={`inline-block h-3 w-3 transform rounded-full bg-white transition-transform ${pad.settings.enableTrigger ? 'translate-x-5' : 'translate-x-1'}`} /></button>
                    </div>
                    {pad.settings.enableTrigger && (<div className="flex items-center justify-between text-sm"><span className="text-slate-400 text-xs">開始時刻(JST/端末)</span><input type="time" step="1" value={pad.settings.triggerTime || ''} onChange={(e) => onUpdate({ triggerTime: e.target.value })} className="bg-slate-800 text-white border border-slate-600 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-500" /></div>)}
                  </div>
                  <div className="flex gap-4">
                    <div className="flex-1 space-y-1">
                      <div className="flex justify-between text-xs items-center"><span>フェードイン</span><input type="number" step="0.1" min="0" max="10" className="bg-slate-800 border border-slate-600 rounded px-1 text-right text-xs w-12 text-white focus:outline-none focus:border-blue-500" value={pad.settings.fadeIn} onChange={(e) => onUpdate({ fadeIn: Math.max(0, parseFloat(e.target.value) || 0) })} /></div>
                      <input type="range" min="0" max="2" step="0.1" value={pad.settings.fadeIn} onChange={(e) => onUpdate({ fadeIn: parseFloat(e.target.value) })} className="w-full accent-blue-400 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer touch-none p-2" />
                    </div>
                    <div className="flex-1 space-y-1">
                      <div className="flex justify-between text-xs items-center"><span>フェードアウト</span><input type="number" step="0.1" min="0" max="10" className="bg-slate-800 border border-slate-600 rounded px-1 text-right text-xs w-12 text-white focus:outline-none focus:border-blue-500" value={pad.settings.fadeOut} onChange={(e) => onUpdate({ fadeOut: Math.max(0, parseFloat(e.target.value) || 0) })} /></div>
                      <input type="range" min="0" max="2" step="0.1" value={pad.settings.fadeOut} onChange={(e) => onUpdate({ fadeOut: parseFloat(e.target.value) })} className="w-full accent-blue-400 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer touch-none p-2" />
                    </div>
                  </div>
                  <div className="space-y-1 pt-2 border-t border-slate-600/50">
                     <div className="flex justify-between text-xs items-center"><div className="flex items-center gap-2"><Volume2 size={14} /> 音量</div><div className="flex items-center gap-1"><input type="number" step="0.1" min="-100" max="12" className="bg-slate-800 border border-slate-600 rounded px-1 text-right text-xs w-16 text-white focus:outline-none focus:border-yellow-500 font-mono" value={pad.settings.volume <= 0.0001 ? -100 : (20 * Math.log10(pad.settings.volume)).toFixed(1)} onChange={(e) => { let db = parseFloat(e.target.value); if (isNaN(db)) db = -100; if (db > 12) db = 12; onUpdate({ volume: db <= -100 ? 0 : Math.pow(10, db / 20) }); }} /><span className="text-xs text-slate-400">dB</span></div></div>
                    <input type="range" min="0" max="4.0" step="0.1" value={pad.settings.volume} onChange={(e) => onUpdate({ volume: parseFloat(e.target.value) })} className="w-full accent-yellow-400 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer touch-none p-2" />
                  </div>
                  <div className="pt-4 border-t border-slate-600/50 text-right"><button onClick={() => { if(confirm("設定を初期状態に戻しますか？")) { onUpdate({ start: 0, end: 1, fadeIn: 0, fadeOut: 0, volume: 1, loop: false }); } }} className="text-xs text-slate-400 hover:text-white underline">設定を初期化</button></div>
                </div>
              </div>
            </div>
            <div className="p-4 bg-slate-900/50 flex items-center justify-center gap-6 flex-shrink-0 relative">
               <button onClick={() => setShowResetConfirm(true)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-md font-medium text-sm transition-colors touch-manipulation">初期化</button>
              <button onClick={onClose} className="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded-full font-bold text-sm transition-colors shadow-lg touch-manipulation">完了</button>
            </div>
            {showResetConfirm && (
              <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm rounded-2xl">
                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl text-center max-w-xs m-4">
                   <div className="flex justify-center mb-4 text-amber-500"><AlertTriangle size={32} /></div>
                   <h3 className="text-lg font-bold text-white mb-2">設定の初期化</h3>
                   <p className="text-slate-300 text-sm mb-6 leading-relaxed">開始・終了位置を含むすべての設定を初期状態に戻しますか？<br/>(音声ファイルは残ります)</p>
                   <div className="flex gap-3 justify-center">
                     <button onClick={() => setShowResetConfirm(false)} className="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium transition-colors">キャンセル</button>
                     <button onClick={() => { onUpdate({ start: 0, end: 1, fadeIn: 0, fadeOut: 0, volume: 1, loop: false, enableTrigger: false, triggerTime: '' }); setShowResetConfirm(false); }} className="px-4 py-2 rounded bg-red-600 hover:bg-red-500 text-white text-sm font-bold shadow-lg transition-colors">初期化する</button>
                   </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SoundBoardApp />);
  </script>
</body>
</html>
